[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
license = "GPL-3.0"
license-files = ["LICENSE"]
name = "coffee_tag"
version = "0.25.19"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "tk",
    "Pillow",
    "RPi.GPIO",
    "quart",
    "quart-auth",
    "bcrypt",
    "spidev",
    "pyserial",
    "juracoffeemachine>=1.3.7"
]

authors = [
    { name = "Toralba Thibault", email = "thibault.toralba@ensta.fr" },
    { name = "Clément Laroudie", email = "clement.laroudie@ensta.fr" },
    { name = "Adrien Poire", email = "adrien.poire@ensta.fr" },
    { name = "Sébastien Kerbourc'h", email = "sebastien.kerbourch@ensta.fr" },
]

maintainers = [
    { name = "Adrien Poire", email = "adrien.poire@ensta.fr" },
    { name = "Sébastien Kerbourc'h", email = "sebastien.kerbourch@ensta.fr" }
]

[project.scripts]
coffee_tag = "coffee_tag.__main__:main"
