<!doctype html>
<html>
<head>
    <title>The U2IS Coffee Machine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        :root {
            --bs-body-color: white !important;
            --bs-body-bg: #754c24 !important;
        }

        footer {
            color: #c9a589;
            background-color: #5B3719;
        }
    </style>
</head>
<body>
<div class="m-5">
    <h1 class="text-center">☕ The U2IS Coffee Machine ☕</h1>
    <div class="d-flex flex-column p-2 justify-content-center align-items-center">
        <p class="fs-3">Login</p>
        <form method="post">
            <input name="mail" placeholder="Mail" required><br>
            <input name="password" type="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>
</div>

<footer class="text-center mt-3 fst-italic fixed-bottom ps-0 pe-0 pt-3 pb-3">
    Cafément vôtre - The U2IS Coffee Team
</footer>
</body>
</html>
