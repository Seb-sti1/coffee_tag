<!doctype html>
<html>
<head>
    <title>The U2IS Coffee Machine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        :root {
            --bs-body-color: white !important;
            --bs-body-bg: #754c24 !important;
        }

        footer {
            color: #c9a589;
            background-color: #5B3719;
        }
    </style>
</head>
<body>
<div class="m-5">
    <h1 class="text-center">☕ The U2IS Coffee Machine ☕</h1>
    <div class="d-flex flex-column justify-content-center align-items-center">
        <p class="fs-3 gap mt-2">We had <strong><span id="coffee-count">0</span></strong> coffees!</p>
        <img style="{height: 20%}" src="{{ url_for('static', filename='cup.gif') }}" alt="coffee cup"/>
    </div>
</div>

<script>
    const target = parseInt("{{ total_coffees }}");
    const elem = document.getElementById("coffee-count");
    const duration = 1500; // ms
    const start = performance.now();

    function easeOutQuad(t) {
        return t * (2 - t);
    }

    function animate(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutQuad(progress);
        const value = Math.floor(eased * target);
        elem.textContent = value;

        if (progress < 1) {
            requestAnimationFrame(animate);
        }
    }

    requestAnimationFrame(animate);
</script>

<footer class="text-center mt-3 fst-italic fixed-bottom ps-0 pe-0 pt-3 pb-3">
    Cafément vôtre - The U2IS Coffee Team
</footer>
</body>
</html>
